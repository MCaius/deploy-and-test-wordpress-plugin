name: Release gates

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, audit, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit

      - name: Lint PHP
        run: composer lint:php

      - name: Build plugin ZIP
        run: npm run build:zip

  php-compatibility:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: "6.0"
            php: "7.4"
            config: .wp-env.wordpress-6.0.json
          - wordpress: "6.0"
            php: "8.0"
            config: .wp-env.wordpress-6.0.json
          - wordpress: latest
            php: "7.4"
            config: .wp-env.test.json
          - wordpress: latest
            php: "8.0"
            config: .wp-env.test.json
          - wordpress: latest
            php: "8.2"
            config: .wp-env.test.json
          - wordpress: latest
            php: "8.3"
            config: .wp-env.test.json

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Start WordPress test environment
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npx wp-env --config=${{ matrix.config }} start --update

      - name: Run PHPUnit integration suite
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: >-
          npx wp-env --config=${{ matrix.config }} run cli php
          wp-content/plugins/deploy-and-test/vendor/bin/phpunit
          -c wp-content/plugins/deploy-and-test/phpunit.xml.dist
          --do-not-cache-result

      - name: Stop WordPress test environment
        if: always()
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npx wp-env --config=${{ matrix.config }} stop

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build and unpack plugin ZIP
        run: |
          npm run build:zip
          mkdir -p dist/package
          unzip -q dist/deploy-and-test.zip -d dist/package

      - name: Run Plugin Check against packaged plugin
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          build-dir: ./dist/package/deploy-and-test
          ignore-codes: plugin_updater_detected

  packaged-install:
    name: Packaged plugin install and activation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build and unpack plugin ZIP
        run: |
          npm run build:zip
          mkdir -p dist/package
          unzip -q dist/deploy-and-test.zip -d dist/package

      - name: Start clean WordPress with packaged plugin
        run: npx wp-env --config=.wp-env.package.json start --update

      - name: Confirm packaged plugin is active
        run: |
          npx wp-env --config=.wp-env.package.json run cli wp plugin status deploy-and-test
          npx wp-env --config=.wp-env.package.json run cli wp eval 'if ( ! defined( "DEPLOY_AND_TEST_PLUGIN_FILE" ) ) { exit( 1 ); } echo "Packaged plugin loaded successfully.\n";'

      - name: Stop packaged-plugin environment
        if: always()
        run: npx wp-env --config=.wp-env.package.json stop

  admin-e2e:
    name: WordPress admin E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start E2E WordPress environment
        run: npm run env:e2e:start -- --update

      - name: Run WordPress admin journeys
        run: npm run test:e2e

      - name: Stop E2E WordPress environment
        if: always()
        run: npm run env:e2e:stop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/

  packaged-update:
    name: Packaged native plugin update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Prepare current and older plugin packages
        run: |
          npm run build:zip
          npm run prepare:update-test

      - name: Start disposable update environment
        run: npm run env:update:start -- --update

      - name: Install older package and perform native update
        run: |
          npx wp-env --config=.wp-env.update.json run cli wp plugin install /var/www/html/wp-content/deploy-and-test-update-fixtures/deploy-and-test-old.zip --activate
          npx wp-env --config=.wp-env.update.json run cli wp eval-file /var/www/html/wp-content/deploy-and-test-update-fixtures/package-update-smoke.php
          npx wp-env --config=.wp-env.update.json run cli wp eval '$plugin = get_plugin_data( WP_PLUGIN_DIR . "/deploy-and-test/deploy-and-test.php" ); if ( ! defined( "DEPLOY_AND_TEST_VERSION" ) || DEPLOY_AND_TEST_VERSION !== $plugin["Version"] ) { exit( 1 ); } echo "Updated package version is synchronized.\n";'

      - name: Stop disposable update environment
        if: always()
        run: npm run env:update:stop
